# Déploiement du jeu de cartes : `docker compose up -d --build`.
#
# Prérequis :
#   1. Créer server/users.txt (voir server/users.txt.example), une ligne
#      "nom:motdepasse" par compte.
#   2. Définir ALLOWED_ORIGINS avec l'URL publique du jeu — REMPLACEZ PAR LA
#      VÔTRE, aucune adresse réelle n'est inscrite ici :
#        ALLOWED_ORIGINS=https://votre-domaine.exemple docker compose up -d --build
#      ou via un fichier .env à côté de ce fichier.
services:
  server:
    build: ./server
    environment:
      USERS_FILE: /data/users.txt
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8090}
    volumes:
      - ./server/users.txt:/data/users.txt:ro
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8090:80"
    depends_on:
      - server
    restart: unless-stopped
